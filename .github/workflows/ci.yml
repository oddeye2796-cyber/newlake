name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  db-api:
    runs-on: ubuntu-24.04
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-retries 40
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: 스키마 적용 (TimescaleDB 경로 포함) + 개발 시드
        run: bash db/init_dev.sh lake
      - name: 재실행 시 모두 건너뛰는지
        run: |
          out=$(bash db/apply.sh lake)
          echo "$out"
          if echo "$out" | grep -q '^== [0-9V].*\.sql$'; then echo "다시 적용된 파일이 있습니다" >&2; exit 1; fi
      - name: TimescaleDB 하이퍼테이블 확인
        run: psql -d lake -v ON_ERROR_STOP=1 -tAc "select count(*) from timescaledb_information.hypertables where hypertable_schema = 'raw'" | grep -qv '^0$'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r api/requirements-dev.txt
      - name: API 테스트 (실제 DB · RLS)
        working-directory: api
        env:
          LAKE_DATABASE_URL: postgresql://svc_app:svc_app_dev@localhost:5432/lake
          LAKE_AGENT_DATABASE_URL: postgresql://svc_agent:svc_agent_dev@localhost:5432/lake
        run: pytest -q
      - name: 한 달치 시연 데이터 (두 번 돌려 다시 만들어지는지)
        env:
          PGDATABASE: lake
        run: |
          python3 tools/seed_demo_month.py
          python3 tools/seed_demo_month.py
          psql -d lake -v ON_ERROR_STOP=1 -tAc "select count(*) from ksx.lot where creator_id = 'demo-seed'" | grep -qv '^0$'
          psql -d lake -v ON_ERROR_STOP=1 -c "select count(*) as risks from mart.v_otd_risk_candidate" \
            -c "select round(100.0 * count(*) filter (where on_time) / nullif(count(on_time), 0), 1) as otd_pct from mart.v_kpi_otd" \
            -c "select count(*) as batches from raw.ingest_batch where scenario_id = 'demo-seed'"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:i18n   # 영어·일본어 번역 누락 검사
      - run: npm run build
