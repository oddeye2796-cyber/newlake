# 개발용: docker compose up --build → 화면 http://localhost:5173 , API http://localhost:8000/docs
# DB 는 운영과 같은 구성(PostgreSQL 16 + TimescaleDB + pgvector). 비밀번호는 개발용 고정값.
services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Seoul
    ports: ["5432:5432"]
    volumes: [pgdata:/home/postgres/pgdata]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 30

  # 스키마 적용 → 접속 계정 → 개발 시드. 다시 띄워도 이미 적용한 파일은 건너뛴다.
  db-init:
    image: timescale/timescaledb-ha:pg16
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes: ["./db:/db:ro"]
    entrypoint: ["bash", "/db/init_dev.sh", "lake"]
    restart: "no"

  api:
    build: ./api
    depends_on:
      db-init: { condition: service_completed_successfully }
    environment:
      LAKE_DATABASE_URL: postgresql://svc_app:svc_app_dev@db:5432/lake
      LAKE_AGENT_DATABASE_URL: postgresql://svc_agent:svc_agent_dev@db:5432/lake
      LAKE_CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]

  web:
    build: ./web
    depends_on: [api]
    environment:
      VITE_API_TARGET: http://api:8000
    ports: ["5173:5173"]

volumes:
  pgdata:
